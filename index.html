<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0c10;--surface:#111318;--surface2:#181c24;--surface3:#1e2330;
  --border:#1f2535;--border2:#283040;
  --accent:#4f8ef7;--accent-dim:rgba(79,142,247,.12);
  --urgent:#f05252;--urgent-dim:rgba(240,82,82,.12);
  --success:#34d399;--success-dim:rgba(52,211,153,.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,.1);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,.12);
  --text:#e4e9f2;--text2:#8892a4;--text3:#3d4a5c;
  --mono:'IBM Plex Mono',monospace;--sans:'Sarabun',sans-serif;
  --r:10px;--nav:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

/* TOPBAR */
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;z-index:50;}
.topbar-logo{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--accent);}
.topbar-title{font-size:15px;font-weight:600;flex:1;}
.topbar-action{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:4px;}

/* PAGES */
.pages{flex:1;overflow:hidden;position:relative;}
.page{display:none;position:absolute;inset:0;overflow-y:auto;padding-bottom:calc(var(--nav)+16px);}
.page.active{display:block;}
.container{max-width:640px;margin:0 auto;padding:16px;}

/* BOTTOM NAV */
.bottom-nav{height:var(--nav);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0;z-index:50;}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text3);font-family:var(--sans);font-size:10px;font-weight:500;transition:all .15s;position:relative;}
.bnav-btn .icon{font-size:20px;line-height:1;transition:transform .15s;}
.bnav-btn.active{color:var(--accent);}
.bnav-btn.active .icon{transform:translateY(-1px);}
.bnav-pip{position:absolute;top:8px;right:calc(50% - 14px);background:var(--urgent);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;font-family:var(--mono);padding:0 3px;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;}
.card-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}

/* FORM */
.field{margin-bottom:14px;}
.field label{font-size:12px;color:var(--text2);display:block;margin-bottom:6px;font-weight:500;}
input[type=text],input[type=number]{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding:11px 13px;color:var(--text);font-family:var(--sans);font-size:14px;outline:none;transition:border-color .15s;-webkit-appearance:none;}
input:focus{border-color:var(--accent);}

/* TOGGLE */
.toggle-group{display:flex;gap:8px;}
.toggle-btn{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding:11px 8px;color:var(--text2);font-family:var(--sans);font-size:13px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;}
.toggle-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.toggle-btn.active.urgent{border-color:var(--urgent);color:var(--urgent);background:var(--urgent-dim);}

/* BUTTONS */
.btn{width:100%;padding:13px;border-radius:var(--r);border:none;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:active{opacity:.85;}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
.btn-danger{background:var(--urgent);color:#fff;}
.btn-success{background:var(--success);color:#0a0c10;}
.btn-sm{background:var(--surface2);border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:var(--sans);font-weight:500;transition:all .15s;white-space:nowrap;}

/* DROPDOWN */
.dropdown-wrap{position:relative;}
.dropdown-list{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);z-index:60;max-height:220px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.dropdown-list.open{display:block;}
.dd-item{padding:11px 13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);transition:background .1s;}
.dd-item:last-child{border-bottom:none;}
.dd-item:hover{background:var(--surface3);}
.dd-sku{font-family:var(--mono);font-size:12px;color:var(--accent);}
.dd-name{font-size:12px;color:var(--text2);margin-top:2px;}
.dd-dims{font-size:11px;color:var(--text3);font-family:var(--mono);}

/* SCANNER */
.scan-trigger{border:1.5px dashed var(--border2);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg);}
.scan-trigger:active{border-color:var(--accent);background:var(--accent-dim);}
#scanner-wrap{display:none;margin-top:10px;}
#scanner-wrap video{width:100%;border-radius:var(--r);max-height:220px;object-fit:cover;}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;}
.badge.urgent{background:var(--urgent-dim);color:#f87171;}
.badge.normal{background:var(--accent-dim);color:#93c5fd;}

/* PICK ITEMS */
.pick-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;transition:all .2s;user-select:none;}
.pick-item.is-urgent{border-left:3px solid var(--urgent);}
.pick-item.selected{border-color:var(--accent);background:rgba(79,142,247,.06);}
.pick-sku{font-family:var(--mono);font-size:12px;color:var(--accent);}
.pick-name{font-size:14px;font-weight:500;margin:3px 0;}
.pick-dims{font-size:11px;color:var(--text2);font-family:var(--mono);}
.pick-dims span{background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:4px;margin-right:3px;}
.pick-vol{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:4px;}
.pick-bottom{display:flex;align-items:center;gap:8px;margin-top:10px;}
.qty-control{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border2);border-radius:8px;overflow:hidden;}
.qty-btn{background:none;border:none;color:var(--text2);width:36px;height:34px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;font-weight:300;}
.qty-btn:active{background:var(--surface2);color:var(--text);}
.qty-val{font-family:var(--mono);font-size:14px;font-weight:500;min-width:32px;text-align:center;color:var(--text);}
.done-btn{margin-left:auto;background:var(--success);color:#0a0c10;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);display:flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;}
.done-btn:active{opacity:.8;}
.move-stock-btn{background:var(--purple-dim);border:1px solid var(--purple);color:var(--purple);border-radius:8px;padding:7px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--sans);white-space:nowrap;}

/* PICK MULTISELECT TOOLBAR */
.pick-toolbar{display:flex;align-items:center;gap:8px;background:var(--urgent-dim);border:1px solid rgba(240,82,82,.3);border-radius:var(--r);padding:10px 14px;margin-bottom:10px;}
.pick-toolbar.show{display:flex;}
.pick-toolbar:not(.show){display:none;}

/* SORT BAR */
.sort-bar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
.sort-bar::-webkit-scrollbar{display:none;}
.sort-chip{background:var(--surface2);border:1px solid var(--border2);color:var(--text2);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap;transition:all .15s;flex-shrink:0;}
.sort-chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 12px;}
.stat-num{font-family:var(--mono);font-size:26px;font-weight:600;}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:2px;}
.stat-box.s-pending .stat-num{color:var(--amber);}
.stat-box.s-urgent .stat-num{color:var(--urgent);}
.stat-box.s-done .stat-num{color:var(--success);}

/* HISTORY */
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;opacity:.8;}
.hi-check{color:var(--success);font-size:16px;flex-shrink:0;}
.hi-info{flex:1;}
.hi-sku{font-family:var(--mono);font-size:11px;color:var(--text3);}
.hi-name{font-size:13px;color:var(--text2);}
.hi-time{font-size:11px;color:var(--text3);font-family:var(--mono);flex-shrink:0;}

/* PRODUCTS TABLE */
.products-toolbar{display:flex;gap:8px;margin-bottom:10px;}
.search-wrap{flex:1;position:relative;}
.search-wrap input{padding-left:36px;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text3);pointer-events:none;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:8px 10px;color:var(--text3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--border);font-weight:600;}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}
.td-sku{font-family:var(--mono);color:var(--accent);font-size:12px;}
.td-dim{font-family:var(--mono);font-size:12px;color:var(--text2);}

/* DELETE TOOLBAR */
.delete-bar{display:none;background:var(--urgent-dim);border:1px solid rgba(240,82,82,.3);border-radius:var(--r);padding:10px 14px;margin-bottom:10px;align-items:center;justify-content:space-between;}
.delete-bar.show{display:flex;}

/* IMPORT */
.import-area{border:1.5px dashed var(--border2);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s;}
.import-area:active{border-color:var(--accent);}
.import-area input{display:none;}
.mode-chip{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding:9px;font-size:12px;cursor:pointer;font-family:var(--sans);color:var(--text2);text-align:center;transition:all .15s;font-weight:500;}
.mode-chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}

/* STOCK COUNT PAGE */
.stock-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;}
.stock-item-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.stock-sku{font-family:var(--mono);font-size:12px;color:var(--accent);}
.stock-name{font-size:14px;font-weight:500;margin-top:2px;}
.stock-ratio{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--amber);}
.stock-ratio.low{color:var(--urgent);}
.stock-ratio.ok{color:var(--success);}
.stock-ratio-lbl{font-size:10px;color:var(--text3);text-align:right;margin-top:2px;}
.stock-bar{height:6px;background:var(--surface2);border-radius:3px;margin-bottom:10px;overflow:hidden;}
.stock-bar-fill{height:100%;border-radius:3px;transition:width .3s;}
.stock-bar-fill.low{background:var(--urgent);}
.stock-bar-fill.ok{background:var(--success);}
.stock-bar-fill.mid{background:var(--amber);}
.stock-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stock-input-wrap label{font-size:11px;color:var(--text3);display:block;margin-bottom:4px;}
.stock-input-wrap input{padding:8px 10px;font-size:13px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;animation:slideUp .25s ease;max-height:85vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:16px;}
.modal-row{display:flex;gap:10px;margin-top:12px;}
.sku-check-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .15s;}
.sku-check-item.checked{border-color:var(--accent);background:var(--accent-dim);}
.sku-check-item input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer;flex-shrink:0;}
.sku-check-label{flex:1;}
.sku-check-code{font-family:var(--mono);font-size:12px;color:var(--accent);}
.sku-check-name{font-size:12px;color:var(--text2);margin-top:1px;}

/* EMPTY */
.empty{text-align:center;padding:48px 16px;color:var(--text3);font-size:13px;}
.empty-icon{font-size:36px;margin-bottom:10px;}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav) + 12px);left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--border2);border-radius:24px;padding:10px 18px;font-size:13px;white-space:nowrap;z-index:999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.4);}

/* RESPONSIVE */
@media(max-width:480px){
  .hide-xs{display:none;}
  td,th{padding:8px 6px;}
  .td-sku{font-size:11px;}
  .td-dim{font-size:11px;}
}
/* MISC */
.ph{margin-bottom:16px;}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-.3px;}
.ph p{font-size:13px;color:var(--text2);margin-top:3px;}
.dl-row{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.recent-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.recent-item:last-child{border-bottom:none;}
.ri-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ri-dot.urgent{background:var(--urgent);}
.ri-dot.normal{background:var(--accent);}
#loading-overlay{position:fixed;inset:0;background:rgba(10,12,16,.9);z-index:9999;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.lo-spin{font-size:32px;animation:spin 1s linear infinite;display:inline-block;margin-bottom:10px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">▦</span>
  <span class="topbar-title" id="topbar-title">Checkout</span>
</div>

<div class="pages">

  <!-- CHECKOUT -->
  <div id="page-checkout" class="page active">
    <div class="container">
      <div class="card">
        <div class="card-label">📷 สแกน Barcode / QR Code</div>
        <div class="scan-trigger" onclick="toggleScanner()">
          <div style="font-size:26px;margin-bottom:6px">⬛</div>
          <div style="font-size:13px;color:var(--text2)" id="scan-label">แตะเพื่อเปิดกล้องสแกน</div>
        </div>
        <div id="scanner-wrap">
          <video id="scanner-video" autoplay playsinline></video>
          <button class="btn btn-ghost" style="margin-top:8px" onclick="stopScanner()">✕ ปิดกล้อง</button>
        </div>
      </div>
      <div class="card">
        <div class="card-label">📝 ข้อมูลการเบิก</div>
        <div class="field">
          <label>SKU Code</label>
          <div class="dropdown-wrap">
            <input type="text" id="sku-input" placeholder="พิมพ์หรือสแกน SKU..." oninput="filterSKU()" onblur="closeDropdownDelay()">
            <div class="dropdown-list" id="sku-dropdown"></div>
          </div>
        </div>
        <div id="selected-info" style="display:none;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 13px;margin-bottom:14px;">
          <div style="font-size:14px;font-weight:500;margin-bottom:4px" id="sel-name"></div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--text2)" id="sel-dims"></div>
        </div>
        <div class="field">
          <label>ประเภทการเบิก</label>
          <div class="toggle-group">
            <button class="toggle-btn active" id="type-normal" onclick="setType('normal')">🔄 ปกติ</button>
            <button class="toggle-btn urgent" id="type-urgent" onclick="setType('urgent')">⚡ ด่วน</button>
          </div>
        </div>
        <div class="field">
          <label>จำนวน</label>
          <input type="number" id="qty-input" value="1" min="1">
        </div>
        <button class="btn btn-primary" onclick="addToPickList()">✈ ยืนยันเบิกสินค้า</button>
      </div>
    </div>
  </div>

  <!-- PICK LIST -->
  <div id="page-picklist" class="page">
    <div class="container">
      <div class="ph"><h1>Pick List</h1><p>รายการรอเบิก — กดค้างเพื่อเลือกหลายรายการ</p></div>
      <div class="sort-bar">
        <button class="sort-chip active" id="sort-vol" onclick="sortList('volume')">📦 Volume ↓</button>
        <button class="sort-chip" id="sort-type" onclick="sortList('type')">⚡ ด่วนก่อน</button>
        <button class="sort-chip" id="sort-sku" onclick="sortList('sku')">🔤 SKU</button>
        <button class="sort-chip" id="sort-time" onclick="sortList('time')">🕐 เวลา</button>
      </div>
      <div class="pick-toolbar" id="pick-toolbar">
        <span style="font-size:13px;color:#f87171;font-weight:500;flex:1" id="pick-sel-count"></span>
        <button class="btn-sm" onclick="moveSelectedToStock()" style="background:var(--purple-dim);border-color:var(--purple);color:var(--purple)">📊 ย้ายไปนับสต็อก</button>
        <button class="btn-sm" onclick="deleteSelectedPick()" style="background:var(--urgent-dim);border-color:var(--urgent);color:var(--urgent)">🗑 ลบ</button>
        <button class="btn-sm" onclick="clearPickSelection()">ยกเลิก</button>
      </div>
      <div id="picklist-container"></div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="page-history" class="page">
    <div class="container">
      <div class="ph" style="display:flex;align-items:flex-start;justify-content:space-between">
        <div><h1>History</h1><p>รายการที่เบิกแล้ว</p></div>
        <button onclick="clearHistory()" style="background:none;border:1px solid var(--border2);color:var(--text3);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--sans);margin-top:4px">🗑 ล้างทั้งหมด</button>
      </div>
      <div id="history-container"></div>
    </div>
  </div>

  <!-- STOCK COUNT -->
  <div id="page-stock" class="page">
    <div class="container">
      <div class="ph"><h1>นับสต็อก</h1><p>คลัง A (ชิ้น) และโกดัง B (ลัง)</p></div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px">
        <span style="font-size:16px">🏭</span>
        <div><div style="font-size:13px;font-weight:600">โกดัง B</div><div style="font-size:11px;color:var(--text3)">นับสต็อกตามหน่วยเดียวกับ Pick List</div></div>
      </div>
      <div class="field">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="stock-search" placeholder="ค้นหา SKU..." oninput="ren
